<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vision Agent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0f14;
      --surface: #13161e;
      --surface2: #1a1e2a;
      --border: #252b3b;
      --accent: #6c63ff;
      --accent2: #9d4edd;
      --success: #22d3a5;
      --error: #f87171;
      --info: #60a5fa;
      --text: #e2e8f0;
      --text-muted: #64748b;
      --radius: 12px;
    }

    body {
      width: 380px;
      min-height: 200px;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 13px;
      line-height: 1.5;
    }

    /* Header */
    .header {
      background: linear-gradient(135deg, #1a1e2a 0%, #0f1220 100%);
      padding: 16px 18px 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
      box-shadow: 0 0 16px rgba(108, 99, 255, 0.4);
    }

    .header-text h1 {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: 0.01em;
    }

    .header-text p {
      font-size: 10px;
      color: var(--text-muted);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .badge {
      margin-left: auto;
      background: rgba(108, 99, 255, 0.15);
      color: var(--accent);
      font-size: 9px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 20px;
      border: 1px solid rgba(108, 99, 255, 0.25);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    /* Body */
    .body { padding: 16px 18px; }

    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 6px;
    }

    textarea {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      padding: 10px 12px;
      resize: vertical;
      min-height: 72px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    textarea::placeholder { color: var(--text-muted); }

    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(108, 99, 255, 0.15);
    }

    /* Buttons */
    .btn-row {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 9px;
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 12px;
      transition: all 0.2s;
    }

    #runBtn {
      flex: 1;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      box-shadow: 0 4px 14px rgba(108, 99, 255, 0.35);
    }

    #runBtn:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(108, 99, 255, 0.5);
    }

    #runBtn:active:not(:disabled) { transform: translateY(0); }

    #runBtn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    #newSessionBtn {
      background: var(--surface2);
      color: var(--text-muted);
      border: 1px solid var(--border);
      padding: 10px 12px;
      font-size: 11px;
    }

    #newSessionBtn:hover {
      background: var(--border);
      color: var(--text);
    }

    /* Spinner */
    #spinner {
      display: none;
      align-items: center;
      gap: 6px;
    }

    .dot-pulse {
      display: flex;
      gap: 3px;
    }

    .dot-pulse span {
      width: 4px;
      height: 4px;
      background: #fff;
      border-radius: 50%;
      animation: pulse 1.2s infinite ease-in-out;
    }

    .dot-pulse span:nth-child(2) { animation-delay: 0.2s; }
    .dot-pulse span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes pulse {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40% { transform: scale(1); opacity: 1; }
    }

    /* Status */
    .status {
      margin-top: 12px;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 500;
      display: none;
    }

    .status.info    { display: block; background: rgba(96,165,250,0.1);  color: var(--info);    border: 1px solid rgba(96,165,250,0.2); }
    .status.success { display: block; background: rgba(34,211,165,0.1);  color: var(--success); border: 1px solid rgba(34,211,165,0.2); }
    .status.done    { background: rgba(34,211,165,0.18); }
    .status.error   { display: block; background: rgba(248,113,113,0.1); color: var(--error);   border: 1px solid rgba(248,113,113,0.2); }

    /* Result section */
    #resultSection {
      display: none;
      margin-top: 14px;
      border-top: 1px solid var(--border);
      padding-top: 14px;
    }

    .result-block { margin-bottom: 12px; }

    .result-block label {
      margin-bottom: 5px;
      color: var(--accent);
    }

    pre {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 10px 12px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: #a5b4fc;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }

    #reasoningOutput {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 9px 12px;
      font-size: 12px;
      color: var(--text-muted);
      font-style: italic;
    }

    /* Divider */
    .divider {
      height: 1px;
      background: var(--border);
      margin: 0 -18px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">🧠</div>
    <div class="header-text">
      <h1>Vision Agent</h1>
      <p>SIH Privacy Browser Automation</p>
    </div>
    <span class="badge">Prototype</span>
  </div>

  <div class="body">
    <label for="taskInput">Task Description</label>
    <textarea
      id="taskInput"
      placeholder='e.g. "Click the login button" or "Type hello@example.com in the email field"'
    ></textarea>

    <div class="btn-row">
      <button id="runBtn">
        <div id="spinner">
          <div class="dot-pulse">
            <span></span><span></span><span></span>
          </div>
        </div>
        <span id="btnLabel">▶ Run Step</span>
      </button>
      <button id="newSessionBtn" title="Start a new session">↺ New</button>
    </div>

    <div id="status" class="status"></div>

    <div id="resultSection">
      <div class="result-block">
        <label>Action</label>
        <pre id="actionOutput"></pre>
      </div>
      <div class="result-block">
        <label>Reasoning</label>
        <p id="reasoningOutput"></p>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
