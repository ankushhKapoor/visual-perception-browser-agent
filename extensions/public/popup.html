<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Visual Perception Agent</title>
  <style>
    /* ─── Reset & base ─── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0d1117;
      --surface:   #161b22;
      --border:    #30363d;
      --accent:    #7c3aed;
      --accent-lo: #4c1d95;
      --accent-hi: #a78bfa;
      --green:     #22c55e;
      --red:       #f87171;
      --yellow:    #fbbf24;
      --text:      #e6edf3;
      --muted:     #8b949e;
      --radius:    10px;
    }

    body {
      width: 360px;
      min-height: 200px;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      font-size: 13px;
      line-height: 1.5;
    }

    /* ─── Header ─── */
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 14px 16px 10px;
      border-bottom: 1px solid var(--border);
    }
    .logo {
      width: 26px;
      height: 26px;
      background: linear-gradient(135deg, var(--accent), #2563eb);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }
    .header-title {
      font-weight: 600;
      font-size: 13.5px;
      letter-spacing: -0.01em;
    }
    .header-badge {
      margin-left: auto;
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 99px;
      font-weight: 600;
      background: var(--accent-lo);
      color: var(--accent-hi);
    }

    /* ─── Main content ─── */
    .main { padding: 14px 16px; }

    /* Intent area */
    .label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .intent-textarea {
      width: 100%;
      min-height: 72px;
      resize: none;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 13px;
      font-family: inherit;
      padding: 10px 12px;
      outline: none;
      transition: border-color 0.15s;
    }
    .intent-textarea:focus {
      border-color: var(--accent);
    }
    .intent-textarea::placeholder { color: var(--muted); }

    /* Run button */
    .run-btn {
      margin-top: 10px;
      width: 100%;
      padding: 10px 0;
      background: linear-gradient(135deg, var(--accent), #2563eb);
      border: none;
      border-radius: var(--radius);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transition: opacity 0.15s, transform 0.1s;
      letter-spacing: 0.02em;
    }
    .run-btn:hover:not(:disabled) { opacity: 0.9; }
    .run-btn:active:not(:disabled) { transform: scale(0.98); }
    .run-btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .run-btn .spinner {
      width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }
    .run-btn.loading .spinner { display: block; }
    .run-btn.loading .btn-label { display: none; }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ─── Status / progress ─── */
    .status-box {
      margin-top: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: none;
    }
    .status-box.visible { display: block; }

    .status-header {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      font-size: 11.5px;
      font-weight: 600;
    }
    .status-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--muted);
      flex-shrink: 0;
    }
    .status-dot.running { background: var(--yellow); animation: pulse 1s ease-in-out infinite; }
    .status-dot.success { background: var(--green); }
    .status-dot.error   { background: var(--red); }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

    .step-list {
      padding: 8px 12px;
      max-height: 160px;
      overflow-y: auto;
    }
    .step-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 4px 0;
      font-size: 11.5px;
    }
    .step-icon { flex-shrink: 0; font-size: 12px; margin-top: 1px; }
    .step-text { color: var(--muted); }
    .step-text.active { color: var(--text); font-weight: 500; }
    .step-text.done   { color: var(--green); }
    .step-text.error  { color: var(--red); }

    /* Progress bar */
    .progress-bar-wrap {
      margin: 0 12px 10px;
      height: 3px;
      background: var(--border);
      border-radius: 99px;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent-hi));
      border-radius: 99px;
      transition: width 0.3s ease;
      width: 0%;
    }

    /* Confirmation panel */
    .confirm-box {
      margin-top: 12px;
      background: rgba(251,191,36,0.08);
      border: 1px solid rgba(251,191,36,0.3);
      border-radius: var(--radius);
      padding: 10px 12px;
      display: none;
    }
    .confirm-box.visible { display: block; }
    .confirm-title {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--yellow);
      margin-bottom: 4px;
    }
    .confirm-reason {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 10px;
    }
    .confirm-actions { display: flex; gap: 8px; }
    .confirm-btn {
      flex: 1;
      padding: 7px 0;
      border-radius: 7px;
      border: none;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .confirm-btn:hover { opacity: 0.85; }
    .confirm-proceed { background: var(--green); color: #000; }
    .confirm-cancel  { background: var(--border); color: var(--text); }

    /* Error message */
    .error-msg {
      margin-top: 10px;
      padding: 8px 12px;
      background: rgba(248,113,113,0.08);
      border: 1px solid rgba(248,113,113,0.25);
      border-radius: var(--radius);
      font-size: 11.5px;
      color: var(--red);
      display: none;
    }
    .error-msg.visible { display: block; }

    /* ─── Footer ─── */
    .footer {
      padding: 8px 16px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 10.5px;
      color: var(--muted);
    }
    .model-chip {
      padding: 2px 7px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 99px;
      font-size: 10px;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="header">
    <div class="logo">👁️</div>
    <span class="header-title">Visual Agent</span>
    <span class="header-badge" id="headerBadge">Ready</span>
  </div>

  <!-- Main -->
  <div class="main">
    <div class="label">What do you want to do?</div>
    <textarea
      id="intentInput"
      class="intent-textarea"
      placeholder="e.g. Search for flights to Goa next Friday…"
      rows="3"
    ></textarea>

    <button id="runBtn" class="run-btn">
      <div class="spinner"></div>
      <span class="btn-label">▶ Run Agent</span>
    </button>

    <!-- Confirmation panel (requires_confirmation = true) -->
    <div id="confirmBox" class="confirm-box">
      <div class="confirm-title">⚠ Agent needs confirmation</div>
      <div id="confirmReason" class="confirm-reason"></div>
      <div class="confirm-actions">
        <button id="confirmProceed" class="confirm-btn confirm-proceed">Proceed</button>
        <button id="confirmCancel"  class="confirm-btn confirm-cancel">Cancel</button>
      </div>
    </div>

    <!-- Error -->
    <div id="errorMsg" class="error-msg"></div>

    <!-- Status / progress -->
    <div id="statusBox" class="status-box">
      <div class="status-header">
        <div id="statusDot" class="status-dot"></div>
        <span id="statusLabel">Initialising…</span>
      </div>
      <div class="progress-bar-wrap">
        <div id="progressBar" class="progress-bar"></div>
      </div>
      <div id="stepList" class="step-list"></div>
    </div>
  </div>

  <!-- Footer -->
  <div class="footer">
    <span id="footerStatus">Privacy-preserving · local processing</span>
    <span class="model-chip" id="modelChip">Qwen2-VL-7B</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
